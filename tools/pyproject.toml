# SPDX-License-Identifier: BSD-3-Clause
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fcpico-tools"
version = "0.1.0"
description = "FC PICO development tools: protocol constants, stream inspection and native bindings"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}

[project.optional-dependencies]
png = ["pillow"]
test = ["pytest", "pillow"]

[tool.setuptools]
packages = ["fcpico", "nes"]
