name: doom-host

on:
  push:
    paths:
      - "doom/**"
      - ".github/workflows/doom-host.yml"
  pull_request:
    paths:
      - "doom/**"
      - ".github/workflows/doom-host.yml"
  workflow_dispatch:

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: doom/tools/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python3 -m pip install -r doom/tools/requirements.txt
      - name: Verify active workflow matches its template
        run: diff -u doom/ci/workflows/doom-host.yml .github/workflows/doom-host.yml
      - name: Configure and build host libraries
        run: cmake -S doom -B build-host -G Ninja -DFCPICO_HOST_ONLY=ON
      - name: Build
        run: cmake --build build-host
      - name: C tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Python and PIO tests
        run: python3 -m pytest doom/tests doom/sim/pioemu -q
      - name: Generated protocol files are fresh
        run: python3 doom/tools/gen_protocol.py --check
      - name: Markdown links resolve
        run: python3 doom/tools/check_md_links.py doom

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: >-
          cmake -S doom -B build-asan -G Ninja
          -DFCPICO_HOST_ONLY=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
      - name: Build and test
        run: cmake --build build-asan && ctest --test-dir build-asan --output-on-failure
