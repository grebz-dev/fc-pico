name: doom-cosim

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      cs1_mask:
        description: "CS1 decode hypothesis (uncalibrated; see issue I-19)"
        default: "0xf000"

jobs:
  cosim:
    name: MesenCE co-simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # doom/rp2040-doom and doom/sim/mesen2/Mesen2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev python3-pip
          python3 -m pip install -r doom/tools/requirements.txt
      - name: Cache the MesenCE build
        id: mesen-cache
        uses: actions/cache@v4
        with:
          # build.sh keeps the cartridge model here and the makefile writes its
          # objects and publish output inside the submodule.
          path: |
            doom/sim/mesen2/build
            doom/sim/mesen2/Mesen2/bin
            doom/sim/mesen2/Mesen2/obj
          key: mesence-${{ hashFiles('doom/sim/mesen2/Mesen2/**/*.h', 'doom/sim/mesen2/Mesen2/**/*.cpp', 'doom/sim/mesen2/Mesen2/makefile', 'doom/sim/cartmodel/*') }}
      - name: Build MesenCE with the FC PICO mapper
        # build.sh also configures, builds and ctests the host cartridge model.
        run: JOBS=4 doom/sim/mesen2/build.sh
      - name: S0 bring-up diagnostic (bridge liveness and determinism)
        # Green here means the cartridge bridge is alive and the run is
        # reproducible with and without debugger peeks.  It does NOT mean S0
        # passes, and it says nothing about hardware calibration.
        run: |
          doom/sim/mesen2/run_scenario.sh S0 --diagnostic \
            --cs1-mask "${{ github.event.inputs.cs1_mask || '0xf000' }}"
      - name: S0 strict (expected to fail until the count contradiction is resolved)
        # Tracked by issue I-19: the measured per-frame count does not match
        # PPU_PICTURE_COUNT.  Recorded, not suppressed, and not worked around by
        # editing protocol constants.
        continue-on-error: true
        # No --golden yet: the screenshot is a white screen produced by a
        # stopped DMA, so there is nothing worth freezing as a reviewed golden.
        run: doom/sim/mesen2/run_scenario.sh S0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosim-results
          path: doom/sim/mesen2/results/
